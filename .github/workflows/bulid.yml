name: Build TetoMidi

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Build Windows executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --name TetoMidi `
            --icon icon.ico `
            --add-data "icon.ico;." `
            --add-data "discord_avatar.png;." `
            --add-data "teto-midi-logo.svg;." `
            --hidden-import PyQt6.QtMultimedia `
            --hidden-import PyQt6.QtCore `
            --hidden-import PyQt6.QtGui `
            --hidden-import PyQt6.QtWidgets `
            --collect-submodules PyQt6 `
            main.py

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetoMidi-windows
          path: dist/TetoMidi.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies for Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libdbus-1-3 libfontconfig1 libxtst6 libx11-6 \
            libpulse0 libasound2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Linux binary
        run: |
          pyinstaller --noconfirm --onefile \
            --name TetoMidi \
            --add-data "icon.ico:." \
            --add-data "discord_avatar.png:." \
            --add-data "teto-midi-logo.svg:." \
            --hidden-import PyQt6.QtMultimedia \
            --hidden-import PyQt6.QtCore \
            --hidden-import PyQt6.QtGui \
            --hidden-import PyQt6.QtWidgets \
            --collect-submodules PyQt6 \
            main.py

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: TetoMidi-linux
          path: dist/TetoMidi
